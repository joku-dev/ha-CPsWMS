# Dedicated staging only. Images are loaded from verified CI archives.
services:
  neo4j:
    image: ${NEO4J_IMAGE:?verified image ID required}
    pull_policy: never
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?local staging secret required}
    volumes:
      - graph-data:/data
      - graph-logs:/logs
    networks: [staging]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 18
    labels:
      governance.environment: staging
      governance.source-commit: ${SOURCE_COMMIT:?source commit required}
  query-api:
    image: ${QUERY_IMAGE:?verified image ID required}
    pull_policy: never
    ports: ['127.0.0.1:18080:8080']
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?local staging secret required}
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      neo4j:
        condition: service_healthy
    networks: [staging, ingress]
    user: "65532:65532"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      governance.environment: staging
      governance.source-commit: ${SOURCE_COMMIT:?source commit required}
volumes:
  graph-data:
  graph-logs:
networks:
  staging:
    internal: true
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
