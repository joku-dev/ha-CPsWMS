version: "3.9"

services:
  neo4j:
    image: neo4j:latest
    container_name: ha-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt Driver
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/ChangeMe123!}
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
    restart: unless-stopped

  ha-sync:
    build: ./ha-sync
    container_name: ha-neo4j-sync
    environment:
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-300}
    depends_on:
      - neo4j
    restart: unless-stopped

  semantic-enrichment:
    build: ./semantic-enrichment
    container_name: ha-semantic-enrichment

    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}

    depends_on:
    - neo4j

    restart: unless-stopped

  query-api:
    build: ./query-api
    container_name: ha-query-api
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QUERY_API_PORT=8080
    depends_on:
      - neo4j
    restart: unless-stopped

  world-model-chat:
    build: ./world-model-chat
    container_name: ha-world-model-chat
    ports:
      - "8090:8090"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.5}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - WORLD_MODEL_CHAT_PORT=8090
    depends_on:
      - neo4j
    restart: unless-stopped
