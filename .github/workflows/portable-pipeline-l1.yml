name: Portable Pipeline L1 (report-only)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  portable:
    name: Portable pipeline L1 (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tested application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: application
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout reviewed governance runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: joku-dev/devsecops-governance-framework
          ref: adc4643bb7a5c962e4efb1525298ad9e652c73d2
          path: governance
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Prepare checksum-pinned runtime tools
        run: |
          python -m venv .venv-portable
          .venv-portable/bin/python -m pip install --require-hashes -r governance/requirements-validation.lock
          .venv-portable/bin/python governance/scripts/install_validation_opa.py --destination .venv-portable/bin/opa
      - name: Test producer evidence boundaries
        run: python -m unittest discover -s application/quality_tests -p test_portable_evidence.py -v
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true
      - name: Archive tested source and inventory exact locked dependencies
        run: python application/scripts/portable_evidence.py prepare --checkout application --output application/.portable-producer
      - name: Generate real inventory and vulnerability scan
        run: |
          trivy fs --format cyclonedx --output application/.portable-producer/raw/sbom.cyclonedx.json application/.portable-producer/inventory
          trivy sbom --format json --list-all-pkgs --output application/.portable-producer/raw/trivy-scan.json application/.portable-producer/raw/sbom.cyclonedx.json
          trivy version --format json > application/.portable-producer/raw/trivy-version.json
          python application/scripts/portable_evidence.py normalize --checkout application --output application/.portable-producer
      - name: Evaluate five-control pipeline scope in report-only mode
        env:
          AXIOM_SCM_READ_TOKEN: ${{ secrets.AXIOM_SCM_READ_TOKEN || github.token }}
        run: |
          mkdir reviewed-profile
          cp application/.governance/portable-profile.json reviewed-profile/consumer.json
          .venv-portable/bin/python governance/scripts/governance_runtime.py run \
            --ci github-actions --profile reviewed-profile/consumer.json --checkout application \
            --artifact .portable-producer/application-source.tar.gz \
            --sbom .portable-producer/sbom.cyclonedx.json \
            --scan .portable-producer/vulnerability-scan.json \
            --output-directory portable-evidence --mode report-only \
            --opa .venv-portable/bin/opa
      - name: Export portable bundle
        if: ${{ always() && hashFiles('portable-evidence/result.json') != '' }}
        run: |
          .venv-portable/bin/python governance/scripts/intake_portable_evidence.py bundle \
            --assessment portable-evidence --checkout application --destination portable-bundle
      - name: Preserve diagnostic after technical failure
        if: ${{ always() }}
        run: |
          mkdir -p portable-evidence
          if [ ! -f portable-evidence/result.json ] && [ ! -f portable-evidence/diagnostics.json ]; then
            printf '%s\n' '{"execution":"error","diagnostics":["producer_or_runtime_did_not_produce_result"]}' > portable-evidence/diagnostics.json
          fi
      - name: Upload producer raw evidence and assessment
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-producer-raw-v1
          path: |
            application/.portable-producer/
            portable-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload portable bundle
        if: ${{ always() && hashFiles('portable-bundle/bundle.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axiom-portable-bundle-v2
          path: portable-bundle/
          if-no-files-found: error
          retention-days: 14
