name: Architecture Runtime Governance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  architecture-governance:
    name: Architecture Runtime Governance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout governance repository
        uses: actions/checkout@v4
        with:
          repository: joku-dev/devsecops-governance-framework
          ref: architecture-baseline-l1-v0.1.0
          path: governance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade jsonschema pyyaml

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Collect architecture governance input
        run: |
          mkdir -p governance/generated/app
          python governance/scripts/collect_architecture_release_input.py \
            --repo app \
            --output governance/generated/app/architecture-release-input.json \
            --release-id "${{ github.sha }}" \
            --baseline "ha-CPsWMS-demo-baseline"

      - name: Generate architecture governance report
        working-directory: governance
        run: |
          python scripts/generate_architecture_governance_report.py \
            --input generated/app/architecture-release-input.json \
            --output-json generated/app/architecture-governance-report.json \
            --output-md generated/app/architecture-governance-report.md
          cat generated/app/architecture-governance-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload architecture governance evidence
        uses: actions/upload-artifact@v4
        with:
          name: architecture-governance-evidence
          path: |
            governance/generated/app/architecture-release-input.json
            governance/generated/app/architecture-governance-report.json
            governance/generated/app/architecture-governance-report.md

      - name: Notify governance repository
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          RESULT_INTAKE_TOKEN: ${{ secrets.GH_RESULT_INTAKE_TOKEN }}
        run: |
          if [ -z "${RESULT_INTAKE_TOKEN}" ]; then
            echo "::warning::GH_RESULT_INTAKE_TOKEN is not configured; architecture result intake was not triggered."
            exit 0
          fi

          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${RESULT_INTAKE_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/joku-dev/devsecops-governance-framework/dispatches \
            -d '{
              "event_type": "architecture-governance-result-ready",
              "client_payload": {
                "repository_id": "${{ github.repository }}",
                "run_id": "${{ github.run_id }}",
                "architecture_baseline_ref": "architecture-baseline-l1-v0.1.0"
              }
            }'
