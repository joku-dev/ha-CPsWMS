name: AXIOM V2 native result reader reference
on:
  push:
    branches: [test/axiom-v2-native-results]
    paths: [.github/workflows/axiom-v2-native-results.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: axiom-v2-native-results-reference
  cancel-in-progress: false
jobs:
  capture-existing-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: joku-dev/devsecops-governance-framework
          ref: ef867276b11107702b7fb46e2911ec9326ce8258
          path: axiom
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Prepare pinned reader environment
        working-directory: axiom
        env:
          VALIDATION_VENV: ${{ runner.temp }}/axiom-native-validation
        run: ./scripts/bootstrap_validation_env.sh
      - name: Read exact historical Main runs without publishing
        working-directory: axiom
        env:
          AXIOM_SCM_READ_TOKEN: ${{ secrets.AXIOM_SCM_READ_TOKEN }}
        run: |
          "$RUNNER_TEMP/axiom-native-validation/bin/python" - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess
          root=Path.cwd();temporary=Path(os.environ['RUNNER_TEMP'])
          python=temporary/'axiom-native-validation/bin/python';opa=temporary/'axiom-native-validation/bin/opa'
          output=temporary/'axiom-native-capture-evidence';output.mkdir(mode=0o700)
          credential=temporary/'axiom-native-reader.json'
          token=os.environ['AXIOM_SCM_READ_TOKEN']
          if not token:raise SystemExit('Explicit repository reader secret is missing')
          credential.write_text(json.dumps({'schema_version':1,'provider':'github-actions',
              'instance':'https://api.github.com','repository':'joku-dev/ha-CPsWMS','token':token}))
          credential.chmod(0o600)
          def command(instance,*args):
              completed=subprocess.run([str(python),'scripts/axiom_v2.py','--instance',str(instance),*args],capture_output=True,text=True,timeout=300)
              if completed.returncode:raise RuntimeError('Native reference command failed: '+completed.stderr)
              return json.loads(completed.stdout)
          receipts=[]
          try:
              for name,domain,run,artifact,baseline in [
                  ('baseline','devsecops','36997125273','devsecops-pipeline-evidence','l1-baseline-v1.1.3'),
                  ('controls','devsecops','36997125273','governance-control-evaluation','l1-baseline-v1.1.3'),
                  ('architecture','architecture','36997124090','architecture-governance-evidence','architecture-baseline-l1-v0.1.0')]:
                  instance=temporary/('axiom-native-reference-'+name)
                  command(instance,'init','--development','--opa',str(opa),'--port','18921')
                  receipt=command(instance,'results','capture-native','--provider','github-actions',
                      '--repository','joku-dev/ha-CPsWMS','--run-id',run,'--attempt','1','--domain',domain,
                      '--artifact-name',artifact,'--baseline-ref',baseline,
                      '--governance-repository','joku-dev/devsecops-governance-framework',
                      '--credential-file',str(credential))
                  inspected=command(instance,'results','inspect-native','--id',receipt['assessment_id'])
                  value=inspected['assessment'];snapshot=value['snapshots'][domain]
                  assert value['source_revision']=='ef867276b11107702b7fb46e2911ec9326ce8258' and value['source_worktree_clean']
                  assert value['input_origin']=='native_reader' and value['capture']['native_metadata_rechecked']
                  assert not value['official_acceptance'] and not value['production_approval'] and not value['authority_transferred']
                  assert snapshot['repository']['commit_id']=='5c3b5cb50d2260bfbde736c9ac80667271406d99'
                  assert snapshot['pipeline']['pipeline_run_id']==run
                  freshness=next(x for x in snapshot['trust']['checks'] if x['id']=='freshness_evaluated')
                  assert freshness['result']=='fail', 'Historical evidence must retain its actual age'
                  assert command(instance,'results','intake-native','--id',receipt['assessment_id'])['results'][domain]['status']=='recorded'
                  projection=command(instance,'results','project','--domain',domain,'--origin','native_reader',
                      '--scm','github','--service','https://api.github.com','--main-branch','main',
                      '--event-profile','legacy-v1','--at',value['assessed_at'])
                  target=output/name;target.mkdir(mode=0o700)
                  shutil.copytree(instance/'state/results-native/raw'/value['input_id'],target/'raw')
                  (target/'assessment.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
                  (target/'projection.json').write_text(json.dumps(command(instance,'results','inspect-project',
                      '--id',projection['projection_id']),sort_keys=True,indent=2)+'\n')
                  receipts.append({'name':name,'domain':domain,'run':run,'attempt':1,'artifact':artifact,
                      'input_id':value['input_id'],'assessment_id':receipt['assessment_id'],
                      'source_revision':value['source_revision'],'runtime_source_digest':value['runtime_source_digest'],
                      'captured_at':value['assessed_at'],'native_metadata_rechecked':True,'freshness':'fail',
                      'new_application_scan':False,'official_acceptance':False})
          finally:credential.unlink(missing_ok=True)
          (output/'receipts.json').write_text(json.dumps(receipts,indent=2)+'\n')
          for path in output.rglob('*'):
              if path.is_file():path.chmod(0o600)
          print(json.dumps({'completed_native_captures':len(receipts),'source_revision':'ef867276b11107702b7fb46e2911ec9326ce8258',
              'historical_main':'5c3b5cb50d2260bfbde736c9ac80667271406d99','published':False,'new_application_scan':False}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axiom-v2-native-reader-reference
          path: ${{ runner.temp }}/axiom-native-capture-evidence
          if-no-files-found: error
          retention-days: 14
