name: DevSecOps Governance

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      governance_mode:
        description: "DevSecOps governance mode for manual runs"
        required: true
        default: "report-only"
        type: choice
        options:
          - report-only
          - block-on-error

jobs:
  devsecops-governance:
    name: DevSecOps Governance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOVERNANCE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.governance_mode || 'report-only' }}
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout governance repository
        uses: actions/checkout@v4
        with:
          repository: joku-dev/devsecops-governance-as-code
          ref: main
          path: governance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Collect DevSecOps governance input
        run: |
          mkdir -p governance/generated/app
          python governance/scripts/collect_devsecops_release_input.py \
            --repo app \
            --output governance/generated/app/devsecops-release-input.json \
            --release-id "${{ github.sha }}"

      - name: Generate DevSecOps governance report
        working-directory: governance
        run: |
          echo "DevSecOps governance mode: ${GOVERNANCE_MODE}" >> "$GITHUB_STEP_SUMMARY"
          python scripts/generate_devsecops_governance_report.py \
            --input generated/app/devsecops-release-input.json \
            --output-json generated/app/devsecops-governance-report.json \
            --output-md generated/app/devsecops-governance-report.md
          cat generated/app/devsecops-governance-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DevSecOps governance evidence
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-governance-evidence
          path: |
            governance/generated/app/devsecops-release-input.json
            governance/generated/app/devsecops-governance-report.json
            governance/generated/app/devsecops-governance-report.md

      - name: Enforce DevSecOps governance findings
        if: ${{ env.GOVERNANCE_MODE == 'block-on-error' }}
        working-directory: governance
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          report = json.loads(Path("generated/app/devsecops-governance-report.json").read_text(encoding="utf-8"))
          finding_count = report.get("summary", {}).get("finding_count", 0)
          if finding_count:
              print(f"DevSecOps governance is configured as block-on-error and found {finding_count} finding(s).")
              for finding in report.get("gate", {}).get("findings", []):
                  print(f"- {finding}")
              raise SystemExit(1)
          print("DevSecOps governance is configured as block-on-error and found no findings.")
          PY
